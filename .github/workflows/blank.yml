name: Android Build CI

# تشغيل البناء عند رفع كود جديد على فرع main أو بشكل يدوي
on:
  push:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      # 1. تحميل الكود المصدري من المستودع
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. إعداد بيئة Java (إصدار 17 هو المعيار الافتراضي حالياً لمشاريع أندرويد)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. إعطاء صلاحيات التشغيل لملف Gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. بناء التطبيق (نسخة Debug للتجربة)
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # 5. استخراج ملف APK ورفعه لتتمكن من تحميله
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickGesturesApp-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
