name: Build Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch: # هذا السطر يضيف لك زراً لتشغيل البناء يدوياً من GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 1. تثبيت بيئة Gradle برقم الإصدار المطلوب على السيرفر
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    # 2. الحل الجذري: توليد ملفات الـ Wrapper وصلاحياتها برمجياً قبل البناء
    - name: Generate Gradle Wrapper
      run: gradle wrapper --gradle-version 8.4

    # 3. بناء التطبيق الآن باستخدام الملفات التي تم توليدها
    - name: Build APK with Gradle Wrapper
      run: ./gradlew assembleDebug --stacktrace

    # 4. رفع ملف الـ APK النهائي لك
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: QuickGestures-App-Debug
        path: app/build/outputs/apk/debug/app-debug.apk
